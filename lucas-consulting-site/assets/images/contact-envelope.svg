<svg viewBox="0 0 500 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of an envelope sending an email">
  <!-- Motion swoosh lines trailing the letter as it exits the envelope -->
  <path d="M 210,150 C 250,120 280,105 305,95" fill="none" stroke="#2e8b3d" stroke-width="10" stroke-linecap="round" />
  <path d="M 220,175 C 260,150 295,130 320,118" fill="none" stroke="#2e8b3d" stroke-width="8" stroke-linecap="round" opacity="0.75" />
  <path d="M 230,198 C 270,178 305,160 328,148" fill="none" stroke="#2e8b3d" stroke-width="6" stroke-linecap="round" opacity="0.5" />

  <!-- Envelope body -->
  <rect x="70" y="170" width="270" height="150" rx="16" fill="#1b3a5c" stroke="#000000" stroke-width="5" />

  <!-- Envelope flap (sealed, folded down) -->
  <path d="M 70,170 L 340,170 L 205,262 Z" fill="#c8102e" stroke="#000000" stroke-width="5" stroke-linejoin="round" />

  <!-- Letter flying out of the envelope, carrying the email -->
  <g transform="translate(330,95) rotate(-12)">
    <rect x="-70" y="-45" width="150" height="95" rx="10" fill="#ffffff" stroke="#000000" stroke-width="4" />
    <line x1="-48" y1="-15" x2="48" y2="-15" stroke="#1b3a5c" stroke-width="6" stroke-linecap="round" />
    <line x1="-48" y1="5" x2="48" y2="5" stroke="#1b3a5c" stroke-width="6" stroke-linecap="round" />
    <line x1="-48" y1="25" x2="10" y2="25" stroke="#1b3a5c" stroke-width="6" stroke-linecap="round" />
    <circle cx="34" cy="25" r="14" fill="#c8102e" />
    <text x="34" y="30" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#ffffff">@</text>
  </g>
</svg>
