<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lucas Consultant Services shield logo">
  <defs>
    <clipPath id="shieldClip">
      <path d="M8,10 L45,4 L50,12 L55,4 L92,10 L92,58 C92,92 70,107 50,117 C30,107 8,92 8,58 Z" />
    </clipPath>
  </defs>

  <!-- Shield background (red field) -->
  <path d="M8,10 L45,4 L50,12 L55,4 L92,10 L92,58 C92,92 70,107 50,117 C30,107 8,92 8,58 Z"
        fill="#c22030" stroke="#7a1420" stroke-width="1.5" />

  <!-- White cross throughout, clipped to shield outline -->
  <g clip-path="url(#shieldClip)">
    <rect x="41" y="0" width="18" height="120" fill="#f4f4f2" />
    <rect x="0" y="49" width="100" height="20" fill="#f4f4f2" />
  </g>

  <!-- Shield outline on top for crisp edge -->
  <path d="M8,10 L45,4 L50,12 L55,4 L92,10 L92,58 C92,92 70,107 50,117 C30,107 8,92 8,58 Z"
        fill="none" stroke="#7a1420" stroke-width="1.5" />

  <!-- LCS lettering -->
  <text x="50" y="65" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-weight="bold" font-size="15" fill="#182a6b">LCS</text>
</svg>
