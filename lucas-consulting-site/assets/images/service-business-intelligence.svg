<svg viewBox="25 30 430 334" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of three analytics charts arranged in a triangle: a red and green trend line chart, an overlapping orange and purple circle diagram, and a light blue three-axis chart, representing business intelligence and analytics">
  <defs>
    <linearGradient id="biCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f6f8" />
    </linearGradient>
  </defs>

  <ellipse cx="240" cy="335" rx="200" ry="14" fill="#000000" opacity="0.07" />

  <!-- CHART 1: red/green trend line chart (bottom left) -->
  <g transform="translate(33.4,-12)">
    <polygon points="195.0,190.0 200.3,186.7 200.3,296.7 195.0,300.0" fill="#8a94a1" />
    <polygon points="45.0,190.0 195.0,190.0 200.3,186.7 50.3,186.7" fill="#e3e7ec" />
    <rect x="45" y="190" width="150" height="110" rx="8" fill="url(#biCardGrad)" stroke="#c7ccd1" stroke-width="1.5" />
    <line x1="58" y1="205" x2="58" y2="285" stroke="#c7ccd1" stroke-width="1.5" />
    <line x1="58" y1="285" x2="182" y2="285" stroke="#c7ccd1" stroke-width="1.5" />
    <polyline points="60,235 84,265 108,215 132,250 156,205 180,245" fill="none" stroke="#4a9c5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="60,255 84,225 108,250 132,205 156,240 180,215" fill="none" stroke="#c9473d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- CHART 2: overlapping circle diagram (top center, elevated) -->
  <g transform="translate(0,20)">
    <polygon points="315.0,28.0 320.3,24.7 320.3,134.7 315.0,138.0" fill="#8a94a1" />
    <polygon points="165.0,28.0 315.0,28.0 320.3,24.7 170.3,24.7" fill="#e3e7ec" />
    <rect x="165" y="28" width="150" height="110" rx="8" fill="url(#biCardGrad)" stroke="#c7ccd1" stroke-width="1.5" />
    <circle cx="217" cy="83" r="30" fill="#d9822b" fill-opacity="0.72" />
    <circle cx="257" cy="83" r="30" fill="#7a5ea8" fill-opacity="0.72" />
  </g>

  <!-- CHART 3: light blue three-axis chart (bottom right) -->
  <g transform="translate(-38.4,-9.5)">
    <polygon points="440.0,185.0 445.3,181.7 445.3,296.7 440.0,300.0" fill="#8a94a1" />
    <polygon points="290.0,185.0 440.0,185.0 445.3,181.7 295.3,181.7" fill="#e3e7ec" />
    <rect x="290" y="185" width="150" height="115" rx="8" fill="url(#biCardGrad)" stroke="#c7ccd1" stroke-width="1.5" />
    <rect x="300" y="195" width="130" height="95" rx="4" fill="#dceefb" />
    <line x1="315" y1="272" x2="405" y2="272" stroke="#3a6a90" stroke-width="2" stroke-linecap="round" />
    <path d="M405,272 L397,268 L397,276 Z" fill="#3a6a90" />
    <line x1="315" y1="272" x2="315" y2="208" stroke="#3a6a90" stroke-width="2" stroke-linecap="round" />
    <path d="M315,208 L311,216 L319,216 Z" fill="#3a6a90" />
    <line x1="315" y1="272" x2="357" y2="240" stroke="#3a6a90" stroke-width="2" stroke-linecap="round" />
    <path d="M357,240 L348,240 L351,247 Z" fill="#3a6a90" />
    <text x="409" y="277" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b3a5c">x</text>
    <text x="309" y="207" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b3a5c">y</text>
    <text x="360" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b3a5c">z</text>
    <circle cx="345" cy="250" r="3.5" fill="#c9973d" />
    <circle cx="370" cy="228" r="3.5" fill="#c9973d" />
    <circle cx="388" cy="258" r="3.5" fill="#1b3a5c" />
    <circle cx="333" cy="238" r="3.5" fill="#1b3a5c" />
    <circle cx="400" cy="235" r="3.5" fill="#c9973d" />
  </g>
</svg>
