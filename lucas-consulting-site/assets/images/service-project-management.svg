<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a whiteboard showing a project timeline with dated milestones and task notes">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9d0d8" />
      <stop offset="100%" stop-color="#9aa5b1" />
    </linearGradient>
    <linearGradient id="frameGradDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a94a1" />
      <stop offset="100%" stop-color="#6e7885" />
    </linearGradient>
  </defs>

  <ellipse cx="240" cy="360" rx="160" ry="14" fill="#000000" opacity="0.07" />

  <!-- marker tray -->
  <rect x="26" y="312" width="428" height="20" rx="8" fill="url(#frameGradDark)" />
  <rect x="55" y="306" width="54" height="11" rx="5.5" fill="#c94f3d" transform="rotate(-2 82 311.5)" />
  <rect x="150" y="307" width="54" height="11" rx="5.5" fill="#3d6fc9" transform="rotate(1.5 177 312.5)" />
  <rect x="246" y="306" width="50" height="11" rx="5.5" fill="#2b2118" transform="rotate(-1 271 311.5)" />
  <rect x="345" y="304" width="66" height="15" rx="4" fill="#e7eaee" transform="rotate(1 378 311.5)" />
  <rect x="345" y="309" width="66" height="4" fill="#c94f3d" opacity="0.7" transform="rotate(1 378 311.5)" />

  <!-- whiteboard frame -->
  <rect x="20" y="16" width="440" height="304" rx="14" fill="url(#frameGrad)" />
  <rect x="36" y="32" width="408" height="272" rx="6" fill="#ffffff" />

  <!-- mounting clips -->
  <rect x="66" y="10" width="26" height="16" rx="4" fill="#7a8492" />
  <rect x="388" y="10" width="26" height="16" rx="4" fill="#7a8492" />

  <!-- timeline -->
  <line x1="78" y1="216" x2="402" y2="216" stroke="#dfe3e8" stroke-width="5" stroke-linecap="round" />
  <line x1="78" y1="216" x2="290" y2="216" stroke="#c9973d" stroke-width="5" stroke-linecap="round" />

  <!-- milestone 1: complete -->
  <circle cx="90" cy="216" r="15" fill="#c9973d" />
  <path d="M83,216 l5,6 l11,-13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="90" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6b7684" text-anchor="middle">May</text>

  <!-- milestone 2: complete -->
  <circle cx="190" cy="216" r="15" fill="#1b3a5c" />
  <path d="M183,216 l5,6 l11,-13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="190" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6b7684" text-anchor="middle">Jun</text>

  <!-- milestone 3: in progress -->
  <circle cx="290" cy="216" r="15" fill="#ffffff" stroke="#1b3a5c" stroke-width="4" />
  <circle cx="290" cy="216" r="5" fill="#1b3a5c" />
  <text x="290" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6b7684" text-anchor="middle">Jul</text>

  <!-- milestone 4: upcoming -->
  <circle cx="390" cy="216" r="15" fill="#ffffff" stroke="#c7ccd1" stroke-width="4" />
  <text x="390" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#a7afb9" text-anchor="middle">Aug</text>

  <!-- sticky note 1 (yellow, done) -->
  <g transform="rotate(-7 90 130)">
    <rect x="63" y="102" width="54" height="52" rx="3" fill="#f7d774" />
    <line x1="72" y1="118" x2="107" y2="118" stroke="#c9a83d" stroke-width="4" stroke-linecap="round" />
    <line x1="72" y1="130" x2="99" y2="130" stroke="#c9a83d" stroke-width="4" stroke-linecap="round" />
    <path d="M72,142 l7,7 l13,-15" fill="none" stroke="#4a7a3d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <line x1="90" y1="156" x2="90" y2="200" stroke="#c9973d" stroke-width="2" stroke-dasharray="2 4" opacity="0.7" />

  <!-- sticky note 2 (blue, done) -->
  <g transform="rotate(5 190 122)">
    <rect x="163" y="94" width="54" height="52" rx="3" fill="#9fc6f0" />
    <line x1="172" y1="110" x2="207" y2="110" stroke="#4a7ea8" stroke-width="4" stroke-linecap="round" />
    <line x1="172" y1="122" x2="199" y2="122" stroke="#4a7ea8" stroke-width="4" stroke-linecap="round" />
    <path d="M172,134 l7,7 l13,-15" fill="none" stroke="#2f5a86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <line x1="190" y1="148" x2="190" y2="200" stroke="#1b3a5c" stroke-width="2" stroke-dasharray="2 4" opacity="0.6" />

  <!-- sticky note 3 (green, in progress) -->
  <g transform="rotate(-4 290 130)">
    <rect x="263" y="102" width="54" height="52" rx="3" fill="#b6dba0" />
    <line x1="272" y1="118" x2="307" y2="118" stroke="#5a8a45" stroke-width="4" stroke-linecap="round" />
    <line x1="272" y1="130" x2="298" y2="130" stroke="#5a8a45" stroke-width="4" stroke-linecap="round" />
    <line x1="272" y1="142" x2="291" y2="142" stroke="#5a8a45" stroke-width="4" stroke-linecap="round" opacity="0.55" />
  </g>
  <line x1="290" y1="156" x2="290" y2="200" stroke="#1b3a5c" stroke-width="2" stroke-dasharray="2 4" opacity="0.6" />

  <!-- sticky note 4 (pink, upcoming) -->
  <g transform="rotate(6 390 122)">
    <rect x="363" y="94" width="54" height="52" rx="3" fill="#f2b9c4" opacity="0.85" />
    <line x1="372" y1="112" x2="407" y2="112" stroke="#c96f85" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="372" y1="124" x2="399" y2="124" stroke="#c96f85" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="372" y1="136" x2="392" y2="136" stroke="#c96f85" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  </g>
  <line x1="390" y1="148" x2="390" y2="200" stroke="#c7ccd1" stroke-width="2" stroke-dasharray="2 4" />

  <!-- corner arrow flourish -->
  <path d="M405,58 C420,58 432,68 434,82" fill="none" stroke="#dfe3e8" stroke-width="4" stroke-linecap="round" />
  <path d="M427,76 L434,82 L440,74" fill="none" stroke="#dfe3e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
